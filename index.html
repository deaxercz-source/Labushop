<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Labubu">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='96' fill='%231a9e5c'/><text x='256' y='350' font-family='system-ui,sans-serif' font-size='300' font-weight='800' fill='white' text-anchor='middle'>L</text></svg>">
<title>🐣 Labubu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f5f6f4; --card:#fff; --line:#e4e7e2; --text:#1c2320; --muted:#6b756f;
  --green:#1a9e5c; --green-bg:#e6f5ec; --red:#d6453d; --red-bg:#fdecea;
  --note-bg:#fff7d6; --note-text:#6b5a12; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

/* login / loading */
#login-screen,#loading-screen{position:fixed;inset:0;background:var(--bg);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px}
#login-screen{display:flex}
#loading-screen{display:none;color:var(--muted)}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.login-box h1{font-size:24px;font-weight:700}
#login-err{color:var(--red);font-size:13px;min-height:16px}

/* controls */
.input{width:100%;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;outline:none}
.input:focus{border-color:var(--green)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-danger{color:var(--red)}
.icon-btn{border:none;background:none;color:var(--muted);padding:4px 6px;font-size:15px;border-radius:6px}
.icon-btn:hover{background:var(--bg)}

/* layout */
#app{display:none;min-height:100vh;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:700;font-size:19px;margin-right:auto}
.user{color:var(--muted);font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tab{border:none;background:none;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--muted)}
.tab.active{background:var(--green-bg);color:var(--green)}
main{max-width:760px;width:100%;margin:0 auto;padding:16px 16px 90px}
.section{display:none}.section.active{display:block}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar .grow{flex:1;min-width:150px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters select{flex:1;min-width:110px;width:auto}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card-h .name{font-weight:700;font-size:17px;margin-right:auto}
.total{font-weight:700;color:var(--green)}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row .when{color:var(--muted);font-size:13px;min-width:44px}
.row .where{font-weight:600;flex:1;min-width:80px}
.row .amt{font-weight:700}
.row .gifts{font-size:13px}
.status{border:none;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:600;background:var(--bg)}
.status.ordered{background:#e3eefc;color:#1d5fb4}
.status.wait{background:#fff0dc;color:#b45f06}
.status.done{background:var(--green-bg);color:var(--green)}
.note{background:var(--note-bg);color:var(--note-text);border-radius:8px;padding:8px 10px;margin-top:8px;display:flex;gap:8px;align-items:flex-start;font-size:14px}
.note .txt{flex:1;white-space:pre-wrap;word-break:break-word}
.card-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.card-actions .btn{padding:6px 10px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.cat{font-size:12px;color:var(--muted)}

/* overview */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .k{color:var(--muted);font-size:13px}
.tile .v{font-size:24px;font-weight:700;margin-top:2px}
.pos{color:var(--green)}.neg{color:var(--red)}

/* modal */
#modal-bg{position:fixed;inset:0;background:rgba(20,28,24,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
#modal-bg.open{display:flex}
.modal{background:#fff;width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media(min-width:600px){#modal-bg{align-items:center}.modal{border-radius:16px}}
.modal h2{font-size:18px;margin-bottom:12px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gift-row{display:flex;gap:8px;margin-bottom:6px}
.gift-row select{flex:1}.gift-row input{width:72px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}

/* mobile bottom tabs */
@media(max-width:600px){
  .top .tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;z-index:30}
  .top .tab{flex:1;text-align:center}
  .user{display:none}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>🐣 Labubu</h1>
    <input class="input" id="login-email" type="email" placeholder="E-mail" autocomplete="username">
    <input class="input" id="login-pass" type="password" placeholder="Heslo" autocomplete="current-password">
    <div id="login-err"></div>
    <button class="btn btn-primary" id="login-btn" onclick="window._fbSignIn()">Přihlásit se</button>
  </div>
</div>

<div id="loading-screen">Načítám…</div>

<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="logo">🐣 Labubu</div>
      <div class="user" id="user-email"></div>
      <nav class="tabs">
        <button class="tab active" data-tab="people" onclick="showTab('people')">Lidé</button>
        <button class="tab" data-tab="expenses" onclick="showTab('expenses')">Výdaje</button>
        <button class="tab" data-tab="overview" onclick="showTab('overview')">Přehled</button>
      </nav>
      <button class="icon-btn" onclick="window._fbSignOut()" title="Odhlásit">⎋</button>
    </div>
  </header>

  <main>
    <section class="section active" id="tab-people">
      <div class="bar">
        <input class="input grow" id="f-q" placeholder="Hledat jméno…" oninput="renderPeopleList()">
        <button class="btn" onclick="openPersonModal()">+ Člověk</button>
        <button class="btn btn-primary" onclick="openBonusModal()">+ Bonus</button>
      </div>
      <div class="filters">
        <select class="input" id="f-status" onchange="renderPeopleList()">
          <option value="all">Všechny stavy</option>
          <option value="pending">⏳ Čeká</option>
          <option value="ordered">📦 Objednáno</option>
          <option value="wait">🕐 Na vyzvednutí</option>
          <option value="done">✅ Předáno</option>
        </select>
        <select class="input" id="f-range" onchange="renderPeopleList()">
          <option value="all">Vše</option>
          <option value="month">Tento měsíc</option>
          <option value="30">30 dní</option>
          <option value="7">7 dní</option>
        </select>
        <select class="input" id="f-site" onchange="renderPeopleList()"></select>
      </div>
      <div id="people-list"></div>
    </section>

    <section class="section" id="tab-expenses">
      <div class="bar">
        <div class="tile grow" style="padding:10px 14px"><span class="k" style="color:var(--muted);font-size:13px">Výdaje celkem</span>
          <div class="v neg" id="exp-total" style="font-size:22px;font-weight:700"></div></div>
        <button class="btn btn-primary" onclick="openExpenseModal()">+ Výdaj</button>
      </div>
      <div id="expenses-list"></div>
    </section>

    <section class="section" id="tab-overview">
      <div class="tiles" id="tiles"></div>
      <div class="card"><div style="font-weight:600;margin-bottom:8px">Zisk po dnech (30 dní)</div>
        <div id="chart-wrap"><canvas id="chart" height="200"></canvas></div></div>
    </section>
  </main>
</div>

<div id="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>

<script>
// ── DATA & FIREBASE ──
var data = {people:[],bonuses:[],expenses:[],notes:[]};
var DB_DOC = 'labubu/main';
var _saveTimer = null;

firebase.initializeApp({
  apiKey: "AIzaSyCtw2jh80pjX6DfGYnp9dooDS38h9Wmshg",
  authDomain: "stanek-kalendar.firebaseapp.com",
  projectId: "stanek-kalendar",
  appId: "1:927791584501:web:ae99a0fd7499efd66d61bc"
});
var auth = firebase.auth();
var db = firebase.firestore();

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function save(){
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function(){
    db.doc(DB_DOC).set(JSON.parse(JSON.stringify(data))).catch(function(e){console.error('Save error:',e);alert('Uložení se nepovedlo.');});
  },400);
}
function showLoading(show){$('loading-screen').style.display=show?'flex':'none';}

function normalize(){
  ['people','bonuses','expenses','notes','sites','costs'].forEach(function(k){if(!Array.isArray(data[k])) data[k]=[];});
}

function initData(userId){
  DB_DOC='labubu/'+userId;
  showLoading(true);
  db.doc(DB_DOC).onSnapshot(function(doc){
    if(doc.exists){
      data=doc.data();
    } else {
      var local=null;
      try{local=JSON.parse(localStorage.getItem('labubu-data')||'null');}catch(e){}
      data=local||{};
      normalize();
      if(local) db.doc(DB_DOC).set(JSON.parse(JSON.stringify(data)));
    }
    normalize();
    showLoading(false);
    render();
  },function(err){console.error('Firestore:',err);showLoading(false);});
}

// ── AUTH ──
window._fbSignIn=function(){
  var btn=$('login-btn'); $('login-err').textContent='';
  btn.textContent='Přihlašuji…'; btn.disabled=true;
  auth.signInWithEmailAndPassword($('login-email').value.trim(),$('login-pass').value).catch(function(){
    $('login-err').textContent='Špatný e-mail nebo heslo.';
    btn.textContent='Přihlásit se'; btn.disabled=false;
  });
};
window._fbSignOut=function(){auth.signOut();};
document.addEventListener('DOMContentLoaded',function(){
  $('login-pass').addEventListener('keydown',function(e){if(e.key==='Enter') window._fbSignIn();});
  auth.onAuthStateChanged(function(user){
    if(user){
      $('login-screen').style.display='none';
      $('app').style.display='flex';
      $('user-email').textContent=user.email;
      initData(user.uid);
    } else {
      $('login-screen').style.display='flex';
      $('app').style.display='none';
      $('login-btn').textContent='Přihlásit se'; $('login-btn').disabled=false;
    }
  });
});

// ── HELPERS ──
var STATUS={pending:'⏳ Čeká',ordered:'📦 Objednáno',wait:'🕐 Na vyzvednutí',done:'✅ Předáno'};
var GIFT={labubu:'🐣 Labubu',dumpling:'🥟 Dumpling'};
var CATS={reklama:'📢 Reklama / spolupráce',material:'📦 Materiál / balení',postovne:'🚚 Poštovné',jine:'💸 Jiné'};

function bonusSite(b){
  if(b.site) return b.site;
  if(b.siteId){
    var s=(data.sites||[]).filter(function(x){return x.id===b.siteId;})[0];
    if(s&&s.name) return s.name;
  }
  return '—';
}
function bonusGifts(b){
  if(Array.isArray(b.gifts)&&b.gifts.length) return b.gifts;
  return b.gift?[{type:b.gift,qty:b.qty||1}]:[];
}
function bonusAmount(b){return Number(b.amount)||0;}
function giftText(b){
  return bonusGifts(b).map(function(g){return (g.type==='dumpling'?'🥟':'🐣')+'×'+(parseInt(g.qty)||1);}).join(' ');
}
function todayISO(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysAgoISO(n){
  var d=new Date(); d.setDate(d.getDate()-n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');
  return m?(parseInt(m[3])+'. '+parseInt(m[2])+'.'):'—';
}
function kc(n){return Math.round(n).toLocaleString('cs-CZ')+' Kč';}
function personName(id){
  var p=data.people.filter(function(x){return x.id===id;})[0];
  return p?p.name:null;
}
function filterBonuses(list,f){
  return list.filter(function(b){
    if(f.status&&f.status!=='all'&&b.status!==f.status) return false;
    if(f.site&&f.site!=='all'&&bonusSite(b)!==f.site) return false;
    if(f.range&&f.range!=='all'){
      var d=b.date||'';
      if(!d) return false;
      if(f.range==='month'){ if(d.slice(0,7)!==todayISO().slice(0,7)) return false; }
      else if(d<daysAgoISO(parseInt(f.range))) return false;
    }
    if(f.q){
      var n=(personName(b.personId)||'').toLowerCase();
      if(n.indexOf(f.q.toLowerCase())<0) return false;
    }
    return true;
  });
}
function personTotal(personId){
  return data.bonuses.filter(function(b){return b.personId===personId;}).reduce(function(s,b){return s+bonusAmount(b);},0);
}
function totals(){
  var bon=data.bonuses.reduce(function(s,b){return s+bonusAmount(b);},0);
  var exp=data.expenses.reduce(function(s,e){return s+(Number(e.amount)||0);},0);
  var pend=0;
  data.bonuses.forEach(function(b){
    if(b.status==='pending'||b.status==='ordered'){
      bonusGifts(b).forEach(function(g){pend+=parseInt(g.qty)||1;});
    }
  });
  return {bonuses:bon,expenses:exp,profit:bon-exp,giftsPending:pend};
}

// ── NAVIGATION / RENDER ──
var currentTab='people';
function showTab(id){
  currentTab=id;
  document.querySelectorAll('.section').forEach(function(s){s.classList.toggle('active',s.id==='tab-'+id);});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.getAttribute('data-tab')===id);});
  render();
}
function render(){
  if(currentTab==='people') renderPeople();
  else if(currentTab==='expenses') renderExpenses();
  else renderOverview();
}

// ── LIDÉ ──
function refreshSiteFilter(){
  var sel=$('f-site'), cur=sel.value||'all', seen={}, names=[];
  data.bonuses.forEach(function(b){var s=bonusSite(b); if(s!=='—'&&!seen[s]){seen[s]=1;names.push(s);}});
  names.sort();
  sel.innerHTML='<option value="all">Všude</option>'+names.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>';}).join('');
  sel.value=names.indexOf(cur)>=0?cur:'all';
}
function renderPeople(){ refreshSiteFilter(); renderPeopleList(); }

function renderPeopleList(){
  var f={q:$('f-q').value.trim(),status:$('f-status').value,range:$('f-range').value,site:$('f-site').value};
  var anyBonusFilter=f.status!=='all'||f.range!=='all'||f.site!=='all';
  var html='';
  var people=data.people.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name),'cs');});
  var known={}; data.people.forEach(function(p){known[p.id]=1;});

  // obecné poznámky (bez existujícího člověka)
  var general=data.notes.filter(function(n){return !n.personId||!known[n.personId];});
  if(general.length&&!f.q&&!anyBonusFilter){
    html+='<div class="card"><div class="card-h"><span class="name">Obecné poznámky</span>'+
      '<button class="icon-btn" onclick="openNoteModal()">＋</button></div>'+general.map(noteHTML).join('')+'</div>';
  }

  var shown=0;
  people.forEach(function(p){
    if(f.q&&String(p.name).toLowerCase().indexOf(f.q.toLowerCase())<0) return;
    var all=data.bonuses.filter(function(b){return b.personId===p.id;});
    var bon=filterBonuses(all,{status:f.status,range:f.range,site:f.site}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
    if(anyBonusFilter&&!bon.length) return;
    shown++;
    var sum=bon.reduce(function(s,b){return s+bonusAmount(b);},0);
    var notes=data.notes.filter(function(n){return n.personId===p.id;});
    html+='<div class="card"><div class="card-h"><span class="name">'+esc(p.name)+'</span><span class="total">'+kc(sum)+'</span></div>';
    html+=bon.map(function(b){
      return '<div class="row">'+
        '<span class="when">'+fmtDate(b.date)+'</span>'+
        '<span class="where">'+esc(bonusSite(b))+'</span>'+
        '<span class="amt">'+kc(bonusAmount(b))+'</span>'+
        (giftText(b)?'<span class="gifts">'+giftText(b)+'</span>':'')+
        '<select class="status '+esc(b.status||'pending')+'" onchange="setBonusStatus(\''+b.id+'\',this.value)">'+
          Object.keys(STATUS).map(function(k){return '<option value="'+k+'"'+((b.status||'pending')===k?' selected':'')+'>'+STATUS[k]+'</option>';}).join('')+
        '</select>'+
        '<button class="icon-btn" onclick="openBonusModal(\'\',\''+b.id+'\')" title="Upravit">✎</button>'+
        '<button class="icon-btn" onclick="deleteBonus(\''+b.id+'\')" title="Smazat">✕</button>'+
      '</div>';
    }).join('');
    if(!bon.length) html+='<div class="cat" style="padding:6px 0">Zatím žádný bonus</div>';
    html+=notes.map(noteHTML).join('');
    html+='<div class="card-actions">'+
      '<button class="btn" onclick="openBonusModal(\''+p.id+'\')">+ Bonus</button>'+
      '<button class="btn" onclick="openNoteModal(\''+p.id+'\')">+ Poznámka</button>'+
      '<button class="btn" onclick="openPersonModal(\''+p.id+'\')">Přejmenovat</button>'+
      '<button class="btn btn-danger" onclick="deletePerson(\''+p.id+'\')">Smazat</button>'+
    '</div></div>';
  });
  if(!shown&&!html) html='<div class="empty">'+(data.people.length?'Nic nevyhovuje filtru.':'Zatím tu nikdo není. Přidej prvního člověka.')+'</div>';
  $('people-list').innerHTML=html;
}
function noteHTML(n){
  return '<div class="note"><div class="txt">'+(n.title?'<b>'+esc(n.title)+'</b> ':'')+esc(n.text)+'</div>'+
    '<button class="icon-btn" onclick="openNoteModal(\'\',\''+n.id+'\')" title="Upravit">✎</button>'+
    '<button class="icon-btn" onclick="deleteNote(\''+n.id+'\')" title="Smazat">✕</button></div>';
}
function setBonusStatus(id,status){
  var b=data.bonuses.filter(function(x){return x.id===id;})[0];
  if(!b) return;
  b.status=status; save(); renderPeopleList();
}

// ── MODAL ──
function openModal(html){$('modal').innerHTML=html;$('modal-bg').classList.add('open');}
function closeModal(){$('modal-bg').classList.remove('open');}

function openPersonModal(id){
  var p=id?data.people.filter(function(x){return x.id===id;})[0]:null;
  openModal('<h2>'+(p?'Přejmenovat':'Nový člověk')+'</h2>'+
    '<div class="fld"><label>Jméno</label><input class="input" id="m-name" value="'+esc(p?p.name:'')+'" placeholder="např. Pepa"></div>'+
    '<div class="modal-foot"><button class="btn" onclick="closeModal()">Zrušit</button>'+
    '<button class="btn btn-primary" onclick="savePerson(\''+(p?p.id:'')+'\')">Uložit</button></div>');
  $('m-name').focus();
}
function savePerson(id){
  var name=$('m-name').value.trim();
  if(!name) return;
  if(id){ data.people.filter(function(x){return x.id===id;})[0].name=name; }
  else data.people.push({id:uid(),name:name});
  save(); closeModal(); render();
}
function deletePerson(id){
  var nb=data.bonuses.filter(function(b){return b.personId===id;}).length;
  var nn=data.notes.filter(function(n){return n.personId===id;}).length;
  if(!confirm('Smazat '+personName(id)+' včetně '+nb+' bonusů a '+nn+' poznámek?')) return;
  data.people=data.people.filter(function(p){return p.id!==id;});
  data.bonuses=data.bonuses.filter(function(b){return b.personId!==id;});
  data.notes=data.notes.filter(function(n){return n.personId!==id;});
  save(); render();
}

function giftRowHTML(type,qty){
  return '<div class="gift-row"><select class="input g-type">'+
    Object.keys(GIFT).map(function(k){return '<option value="'+k+'"'+(type===k?' selected':'')+'>'+GIFT[k]+'</option>';}).join('')+
    '</select><input class="input g-qty" type="number" min="1" value="'+esc(qty||1)+'">'+
    '<button class="icon-btn" onclick="this.parentNode.remove()">✕</button></div>';
}
function addGiftRow(){ $('m-gifts').insertAdjacentHTML('beforeend',giftRowHTML('labubu',1)); }

function openBonusModal(personId,bonusId){
  if(!data.people.length){ alert('Nejdřív přidej člověka.'); return; }
  var b=bonusId?data.bonuses.filter(function(x){return x.id===bonusId;})[0]:null;
  var pid=b?b.personId:(personId||'');
  var sites={}; data.bonuses.forEach(function(x){var s=bonusSite(x); if(s!=='—') sites[s]=1;});
  var gifts=b?bonusGifts(b):[];
  openModal('<h2>'+(b?'Upravit bonus':'Nový bonus')+'</h2>'+
    '<div class="fld"><label>Člověk</label><select class="input" id="m-person">'+
      data.people.map(function(p){return '<option value="'+p.id+'"'+(p.id===pid?' selected':'')+'>'+esc(p.name)+'</option>';}).join('')+'</select></div>'+
    '<div class="two"><div class="fld"><label>Kde</label><input class="input" id="m-site" list="m-sites" value="'+esc(b&&bonusSite(b)!=='—'?bonusSite(b):'')+'" placeholder="např. Alza">'+
      '<datalist id="m-sites">'+Object.keys(sites).map(function(s){return '<option value="'+esc(s)+'">';}).join('')+'</datalist></div>'+
    '<div class="fld"><label>Bonus (Kč)</label><input class="input" id="m-amount" type="number" min="0" value="'+esc(b?bonusAmount(b):'')+'"></div></div>'+
    '<div class="two"><div class="fld"><label>Datum</label><input class="input" id="m-date" type="date" value="'+esc(b&&b.date?b.date:todayISO())+'"></div>'+
    '<div class="fld"><label>Stav</label><select class="input" id="m-status">'+
      Object.keys(STATUS).map(function(k){return '<option value="'+k+'"'+(((b&&b.status)||'pending')===k?' selected':'')+'>'+STATUS[k]+'</option>';}).join('')+'</select></div></div>'+
    '<div class="fld"><label>Dárky <button class="icon-btn" onclick="addGiftRow()">＋ přidat</button></label><div id="m-gifts">'+
      gifts.map(function(g){return giftRowHTML(g.type,g.qty);}).join('')+'</div></div>'+
    '<div class="modal-foot"><button class="btn" onclick="closeModal()">Zrušit</button>'+
    '<button class="btn btn-primary" onclick="saveBonus(\''+(b?b.id:'')+'\')">Uložit</button></div>');
}
function saveBonus(id){
  var amount=parseFloat($('m-amount').value);
  if(isNaN(amount)||amount<0){ $('m-amount').focus(); return; }
  var gifts=[].slice.call($('m-gifts').querySelectorAll('.gift-row')).map(function(r){
    return {type:r.querySelector('.g-type').value,qty:Math.max(1,parseInt(r.querySelector('.g-qty').value)||1)};
  });
  var rec={personId:$('m-person').value,site:$('m-site').value.trim(),amount:amount,gifts:gifts,
    status:$('m-status').value,date:$('m-date').value||todayISO()};
  if(id){
    var b=data.bonuses.filter(function(x){return x.id===id;})[0];
    Object.keys(rec).forEach(function(k){b[k]=rec[k];});
    delete b.gift; delete b.qty; // staré pole nahrazuje gifts
  } else { rec.id=uid(); rec.note=''; data.bonuses.push(rec); }
  save(); closeModal(); render();
}
function deleteBonus(id){
  if(!confirm('Smazat tento bonus?')) return;
  data.bonuses=data.bonuses.filter(function(b){return b.id!==id;});
  save(); render();
}

function openNoteModal(personId,noteId){
  var n=noteId?data.notes.filter(function(x){return x.id===noteId;})[0]:null;
  var pid=n?(n.personId||''):(personId||'');
  openModal('<h2>'+(n?'Upravit poznámku':'Nová poznámka')+'</h2>'+
    '<div class="fld"><label>Člověk</label><select class="input" id="m-person"><option value="">— obecná poznámka —</option>'+
      data.people.map(function(p){return '<option value="'+p.id+'"'+(p.id===pid?' selected':'')+'>'+esc(p.name)+'</option>';}).join('')+'</select></div>'+
    '<div class="fld"><label>Text</label><textarea class="input" id="m-text" rows="4">'+esc(n?n.text:'')+'</textarea></div>'+
    '<div class="modal-foot"><button class="btn" onclick="closeModal()">Zrušit</button>'+
    '<button class="btn btn-primary" onclick="saveNote(\''+(n?n.id:'')+'\')">Uložit</button></div>');
  $('m-text').focus();
}
function saveNote(id){
  var text=$('m-text').value.trim();
  if(!text) return;
  var pid=$('m-person').value;
  if(id){
    var n=data.notes.filter(function(x){return x.id===id;})[0];
    n.text=text; n.personId=pid;
  } else data.notes.push({id:uid(),title:'',text:text,personId:pid,color:'',date:todayISO()});
  save(); closeModal(); render();
}
function deleteNote(id){
  if(!confirm('Smazat poznámku?')) return;
  data.notes=data.notes.filter(function(n){return n.id!==id;});
  save(); render();
}

// ── VÝDAJE ──
function renderExpenses(){
  var list=data.expenses.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  $('exp-total').textContent=kc(totals().expenses);
  $('expenses-list').innerHTML=list.length?list.map(function(e){
    return '<div class="card"><div class="card-h"><span class="name" style="font-size:15px">'+esc(e.name)+'</span>'+
      '<span class="neg" style="font-weight:700">'+kc(Number(e.amount)||0)+'</span>'+
      '<button class="icon-btn" onclick="openExpenseModal(\''+e.id+'\')">✎</button>'+
      '<button class="icon-btn" onclick="deleteExpense(\''+e.id+'\')">✕</button></div>'+
      '<div class="cat">'+fmtDate(e.date)+' · '+esc(CATS[e.category]||CATS.jine)+(e.note?' · '+esc(e.note):'')+'</div></div>';
  }).join(''):'<div class="empty">Zatím žádné výdaje.</div>';
}
function openExpenseModal(id){
  var e=id?data.expenses.filter(function(x){return x.id===id;})[0]:null;
  openModal('<h2>'+(e?'Upravit výdaj':'Nový výdaj')+'</h2>'+
    '<div class="fld"><label>Název</label><input class="input" id="m-name" value="'+esc(e?e.name:'')+'"></div>'+
    '<div class="two"><div class="fld"><label>Částka (Kč)</label><input class="input" id="m-amount" type="number" min="0" value="'+esc(e?e.amount:'')+'"></div>'+
    '<div class="fld"><label>Datum</label><input class="input" id="m-date" type="date" value="'+esc(e&&e.date?e.date:todayISO())+'"></div></div>'+
    '<div class="fld"><label>Kategorie</label><select class="input" id="m-cat">'+
      Object.keys(CATS).map(function(k){return '<option value="'+k+'"'+(((e&&e.category)||'reklama')===k?' selected':'')+'>'+CATS[k]+'</option>';}).join('')+'</select></div>'+
    '<div class="fld"><label>Poznámka</label><input class="input" id="m-note" value="'+esc(e?e.note:'')+'"></div>'+
    '<div class="modal-foot"><button class="btn" onclick="closeModal()">Zrušit</button>'+
    '<button class="btn btn-primary" onclick="saveExpense(\''+(e?e.id:'')+'\')">Uložit</button></div>');
}
function saveExpense(id){
  var name=$('m-name').value.trim(), amount=parseFloat($('m-amount').value);
  if(!name||isNaN(amount)) return;
  var rec={name:name,amount:amount,date:$('m-date').value||todayISO(),category:$('m-cat').value,note:$('m-note').value.trim()};
  if(id){ var e=data.expenses.filter(function(x){return x.id===id;})[0]; Object.keys(rec).forEach(function(k){e[k]=rec[k];}); }
  else { rec.id=uid(); data.expenses.push(rec); }
  save(); closeModal(); render();
}
function deleteExpense(id){
  if(!confirm('Smazat výdaj?')) return;
  data.expenses=data.expenses.filter(function(e){return e.id!==id;});
  save(); render();
}

// ── PŘEHLED ──
var _chart=null;
function renderOverview(){
  var t=totals();
  $('tiles').innerHTML=
    '<div class="tile"><div class="k">Bonusy</div><div class="v">'+kc(t.bonuses)+'</div></div>'+
    '<div class="tile"><div class="k">Výdaje</div><div class="v neg">'+kc(t.expenses)+'</div></div>'+
    '<div class="tile"><div class="k">Zisk</div><div class="v '+(t.profit>=0?'pos':'neg')+'">'+kc(t.profit)+'</div></div>'+
    '<div class="tile"><div class="k">Dárků k odeslání</div><div class="v">'+t.giftsPending+'</div></div>';

  var days=[], map={};
  for(var i=29;i>=0;i--){var d=daysAgoISO(i); days.push(d); map[d]=0;}
  var has=false;
  data.bonuses.forEach(function(b){if(b.date&&map[b.date]!==undefined){map[b.date]+=bonusAmount(b);has=true;}});
  data.expenses.forEach(function(e){if(e.date&&map[e.date]!==undefined){map[e.date]-=Number(e.amount)||0;has=true;}});
  if(_chart){_chart.destroy();_chart=null;}
  var wrap=$('chart-wrap');
  if(!has){ wrap.innerHTML='<div class="empty">Zatím žádná data za posledních 30 dní.</div>'; return; }
  if(!$('chart')) wrap.innerHTML='<canvas id="chart" height="200"></canvas>';
  var vals=days.map(function(d){return map[d];});
  _chart=new Chart($('chart'),{
    type:'bar',
    data:{labels:days.map(fmtDate),datasets:[{data:vals,
      backgroundColor:vals.map(function(v){return v>=0?'#1a9e5c':'#d6453d';}),borderRadius:4}]},
    options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:8}},y:{ticks:{callback:function(v){return v+' Kč';}}}}}
  });
}
</script>
